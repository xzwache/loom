version: "2"

run:
  build-tags:
    - integration

linters:
  default: standard # errcheck, govet, ineffassign, staticcheck, unused
  enable:
    - bodyclose
    - contextcheck
    - copyloopvar
    - errname
    - errorlint
    - exhaustive
    - gocritic
    - gosec
    - misspell
    - nolintlint
    - revive
    - unconvert
    - unparam
    - usetesting
  settings:
    exhaustive:
      default-signifies-exhaustive: true
    nolintlint:
      require-explanation: true
      require-specific: true
    revive:
      rules:
        - name: package-comments
        - name: context-as-argument
          arguments:
            - allowTypesBefore: "*testing.T"
        - name: error-strings
        - name: error-naming
        - name: receiver-naming
        - name: var-naming
        - name: unused-parameter
  exclusions:
    presets:
      - std-error-handling
    rules:
      - path: (_test\.go|test/[^/]+\.go)$
        linters:
          - gosec

formatters:
  enable:
    - gofumpt
    - goimports
  settings:
    goimports:
      local-prefixes:
        - github.com/xzwache/loom
